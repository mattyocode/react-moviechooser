# A variable with no URI part, so the original request URI is passed through unchanged.
proxy_pass $api_upstream;
proxy_set_header Host $host;
# The hop into nginx is plain HTTP; Django (SECURE_SSL_REDIRECT) trusts this header.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
proxy_set_header X-Real-IP $http_cf_connecting_ip;
# api is on the same host: fail fast (502/504) rather than hang on a stale address.
proxy_connect_timeout 2s;
proxy_read_timeout 120s;
