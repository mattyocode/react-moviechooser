name: tests

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    branches:
      - "**"
      - "!main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Run tests
        run: yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - uses: docker/setup-buildx-action@v3

      # The image build runs `yarn build`, so this is also the app's build check.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: react-moviechooser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the nginx image's routing
        run: scripts/test-nginx.sh
        env:
          IMAGE: react-moviechooser:test
          SKIP_BUILD: "1"
