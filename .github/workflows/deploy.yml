name: Build and push image

on:
  push:
    branches:
      - main

# A newer push to main cancels an older run. That doesn't cover re-running an old run,
# so the push step also checks that this commit is still main's tip before moving `main`.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mattyocode/react-moviechooser

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Run tests
        run: yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # Build once into the local daemon; the routing tests run against this image
      # and the same image is pushed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the nginx image's routing
        run: scripts/test-nginx.sh
        env:
          IMAGE: ${{ env.IMAGE }}:main
          SKIP_BUILD: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- tags are immutable, so always push them. Only move `main` if this commit is
      # still main's tip: a re-run of an older run must not roll the tag back.
      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          for tag in $TAGS; do
            if [ "$tag" = "$IMAGE:main" ] && [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::warning::Not moving $IMAGE:main: $GITHUB_SHA is no longer main's tip ($tip)"
              continue
            fi
            docker push "$tag"
          done
