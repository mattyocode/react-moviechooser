name: Build and push image

on:
  push:
    branches:
      - main

# A newer push to main cancels an older run. That doesn't cover re-running an old run,
# so the push step also checks that this commit is still main's tip before moving `main`
# or deploying.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mattyocode/react-moviechooser

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.push.outputs.ref }}
      deploy: ${{ steps.push.outputs.deploy }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Run tests
        run: yarn test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # Build once into the local daemon; the routing tests run against this image
      # and the same image is pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the nginx image's routing
        run: scripts/test-nginx.sh
        env:
          IMAGE: ${{ env.IMAGE }}:main
          SKIP_BUILD: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- tags are immutable, so always push them. Only move `main` if this commit is
      # still main's tip: a re-run of an older run must not roll the tag back.
      - name: Push the tested image
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          deploy=true
          for tag in $TAGS; do
            if [ "$tag" = "$IMAGE:main" ] && [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::warning::Not moving $IMAGE:main or deploying: $GITHUB_SHA is no longer main's tip ($tip)"
              deploy=false
              continue
            fi
            docker push "$tag"
          done
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:main" | grep "^$IMAGE@sha256:")
          echo "Pushed $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Joins the tailnet as tag:ci and runs the server's deploy.sh over Tailscale SSH.
  # The script and compose file come from moviechooser-api (see its docs/deploy.md).
  deploy:
    needs: image
    if: needs.image.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://moviechooser.co.uk
    permissions:
      contents: read
    env:
      IMAGE_REF: ${{ needs.image.outputs.image-ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # Tailscale SSH: the tailnet already authenticates the server (WireGuard keys),
      # and the runner is new every time, so don't pin a host key.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      - name: Deploy
        run: |
          # shellcheck disable=SC2029 # $IMAGE_REF is meant to expand on the runner
          ssh prod sh /srv/moviechooser/deploy.sh frontend "$IMAGE_REF"
