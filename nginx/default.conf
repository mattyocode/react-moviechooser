# Serves the Vite build as an SPA and proxies Django's paths to the `api` container.
# Traffic: Cloudflare Tunnel -> cloudflared -> this server (plain HTTP on 8080) -> api:8000.

# Browser page loads send Accept: text/html; API calls (axios) don't.
map $http_accept $wants_html {
    default 0;
    "~*text/html" 1;
}

# /auth/ answers by Accept (page or API), so tell caches. Keyed on the original
# URI, so it also applies once /auth/... has been rewritten to /index.html.
map $request_uri $auth_vary {
    default "";
    "~^/auth/" Accept;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve `api` per request through Docker's DNS (proxy_pass uses a variable), so a
    # recreated api container's new IP is picked up and nginx starts even if api is down.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles: cache forever, and never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Vary $auth_vary;
    }

    # Anything else: the file if it exists, otherwise the SPA (React Router deep links).
    location / {
        try_files $uri /index.html;
    }

    # Always Django. WhiteNoise serves /static/. Also matches no trailing slash
    # (/admin), so Django's APPEND_SLASH redirect works instead of the SPA.
    location ~ ^/(api|admin|static|accounts|list)(/|$) {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Always Django: opened straight from the password-reset email.
    location ^~ /auth/password-reset-confirm/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Shared with the SPA (/auth/:params), like the bypass rule in vite.config.mjs.
    location /auth/ {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        add_header Vary $auth_vary always;
        include /etc/nginx/snippets/proxy-api.conf;
    }
}
